    <!-- Phase 7 QA fix: with no icon link at all, every browser silently
         requests /favicon.ico and logs a 404 (a real "broken asset request"
         on every page load, not a sandbox artifact) since this project has
         no public/ directory. A plain inline SVG star avoids adding a new
         binary asset or a whole public/ folder for one small fix. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2305070f'/%3E%3Cpath d='M12 3.5l2.02 5.51 5.73.4-4.4 3.77 1.44 5.62L12 15.9l-4.79 2.9 1.44-5.62-4.4-3.77 5.73-.4z' fill='%238fb3ff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
